[package]
name = "mcpg-plugin-cache-memory"
version = "0.1.0-alpha.20"
license = "Apache-2.0"
edition = "2024"
description = "In-process LRU+TTL cache plugin for MCPG (dev.mcpg.cache.memory) — no network, per-entry TTL via moka."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.18", version = "=0.1.0-beta.18" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.18", version = "=0.1.0-beta.18", features = ["static-firstparty"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
tracing = "0.1"
# Pure-Rust concurrent cache (MIT/Apache-2.0); the `sync` feature is required
# for the synchronous Cache type (not default since 0.12). No TLS / no network.
moka = { version = "0.12", default-features = false, features = ["sync"] }

[features]
default = []
cdylib-export = []
static-firstparty = []
